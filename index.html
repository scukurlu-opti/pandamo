<style>
/* Grundgerüst: Safe-Area des iPhones, Reset */
:root{
  color-scheme:light dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;background:#F3EADB;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

<body>
<style>
/* ============================================================
   PANDAMO — Find your calm.
   Bewegungsapp bei Morbus Bechterew
   ============================================================ */
:root{
  --bg:#F3EADB; --bg-2:#EADDC7;
  --card:#FCF7EE; --card-2:#F1E8D7; --card-3:#E6DAC3;
  --ink:#3B2A1E; --ink-2:#6E5B4B; --ink-3:#9C8A77;
  --green:#4C7A3E; --green-2:#3C6531; --green-soft:#DEE8CE; --green-ink:#33582A;
  --leaf:#6FA84B; --rose:#E0A08C; --amber:#DE8A3C;
  --line:rgba(92,68,44,.12); --line-2:rgba(92,68,44,.07);
  --shadow-s:0 2px 6px rgba(88,66,44,.06);
  --shadow-m:0 8px 20px rgba(88,66,44,.10);
  --shadow-l:0 16px 38px rgba(88,66,44,.16);
  --overlay:rgba(59,42,30,.42);
  --panda-dark:#40332C; --panda-dark-2:#584739; --panda-light:#FDFAF3;
  --panda-shade:#EADFCB; --paw:#C99B72; --paw-2:#A9764F;
  --mat:#93AC6B; --mat-2:#7E9659;
  --room-1:#F8EAD2; --room-2:#EFDCBB; --room-3:#E2CBA2;
  --wood:#C79C6C; --lantern:#F2B95C; --glow:rgba(242,185,92,.35);
  --scrim:rgba(255,255,255,.62);
  --font-display:'Fredoka','Trebuchet MS',ui-rounded,system-ui,sans-serif;
  --font-body:'Nunito Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1D1812; --bg-2:#16120D;
    --card:#2A231B; --card-2:#332B21; --card-3:#3D3328;
    --ink:#F4EADA; --ink-2:#C4B3A0; --ink-3:#95836F;
    --green:#82AC62; --green-2:#6D9650; --green-soft:#2F3B25; --green-ink:#C6DCB0;
    --leaf:#8FC067; --rose:#D0917E; --amber:#E39B55;
    --line:rgba(244,234,218,.12); --line-2:rgba(244,234,218,.06);
    --shadow-s:0 2px 6px rgba(0,0,0,.30);
    --shadow-m:0 8px 20px rgba(0,0,0,.38);
    --shadow-l:0 16px 38px rgba(0,0,0,.48);
    --overlay:rgba(10,8,5,.62);
    --panda-dark:#2E251F; --panda-dark-2:#463A2F; --panda-light:#EFE6D6;
    --panda-shade:#CDBFA6; --paw:#A9805E; --paw-2:#835B3B;
    --mat:#6E8451; --mat-2:#5B6E42;
    --room-1:#3A3024; --room-2:#2E271D; --room-3:#241E16;
    --wood:#7A5C3C; --lantern:#C98F3E; --glow:rgba(201,143,62,.28);
    --scrim:rgba(29,24,18,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#1D1812; --bg-2:#16120D;
  --card:#2A231B; --card-2:#332B21; --card-3:#3D3328;
  --ink:#F4EADA; --ink-2:#C4B3A0; --ink-3:#95836F;
  --green:#82AC62; --green-2:#6D9650; --green-soft:#2F3B25; --green-ink:#C6DCB0;
  --leaf:#8FC067; --rose:#D0917E; --amber:#E39B55;
  --line:rgba(244,234,218,.12); --line-2:rgba(244,234,218,.06);
  --shadow-s:0 2px 6px rgba(0,0,0,.30);
  --shadow-m:0 8px 20px rgba(0,0,0,.38);
  --shadow-l:0 16px 38px rgba(0,0,0,.48);
  --overlay:rgba(10,8,5,.62);
  --panda-dark:#2E251F; --panda-dark-2:#463A2F; --panda-light:#EFE6D6;
  --panda-shade:#CDBFA6; --paw:#A9805E; --paw-2:#835B3B;
  --mat:#6E8451; --mat-2:#5B6E42;
  --room-1:#3A3024; --room-2:#2E271D; --room-3:#241E16;
  --wood:#7A5C3C; --lantern:#C98F3E; --glow:rgba(201,143,62,.28);
  --scrim:rgba(29,24,18,.55);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;margin:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--green);outline-offset:3px;border-radius:10px}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}

/* ---------- Shell ---------- */
#app{height:100%;max-width:440px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 16px 26px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---------- Kopf ---------- */
.apphead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 2px 16px}
.wordmark{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.05;color:var(--ink);display:flex;align-items:center;gap:7px}
.wordmark em{font-style:normal;color:var(--green)}
.wordmark svg{width:20px;height:20px;color:var(--leaf)}
.claim{font-family:var(--font-body);font-style:italic;font-size:13px;color:var(--ink-3);letter-spacing:.03em;margin-top:3px}
.greet{font-family:var(--font-display);font-weight:500;font-size:20px;color:var(--ink-2);margin-top:12px;display:flex;align-items:center;gap:7px}
.greet svg{width:21px;height:21px;flex:0 0 21px}
.greet .gic{display:inline-flex;color:var(--amber)}
.greet .gic.leaf{color:var(--leaf)}
.greet-sub{font-size:14px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.head-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.bell{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--card);box-shadow:var(--shadow-s);display:grid;place-items:center;position:relative}
.bell svg{width:21px;height:21px}
.bell .dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:2px solid var(--card)}
.hand-note{font-style:italic;color:var(--ink-3);font-size:12.5px;line-height:1.4;text-align:right;max-width:124px;transform:rotate(-4deg)}

/* ---------- Karten ---------- */
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow-s)}
.hero{position:relative;border-radius:26px;overflow:hidden;box-shadow:var(--shadow-m);background:var(--room-2);width:100%;display:block}
.hero-scene{position:absolute;inset:0}
.hero-scene svg{width:100%;height:100%;display:block}
.hero-body{position:relative;padding:22px 18px 20px;min-height:252px;display:flex;flex-direction:column;justify-content:center;width:62%;
  background:linear-gradient(96deg, var(--room-1) 42%, transparent 92%)}
.hero h2{font-size:31px;line-height:1.06;color:var(--ink)}
.hero p{margin-top:8px;font-size:14.5px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--green);color:#FCF8F0;font-family:var(--font-display);font-weight:600;font-size:17px;padding:14px 22px;border-radius:999px;box-shadow:0 8px 18px rgba(60,101,49,.26);transition:transform .16s ease,box-shadow .16s ease}
.btn svg{width:18px;height:18px}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow-s)}
.btn.soft{background:var(--green-soft);color:var(--green-ink);box-shadow:none}
.btn.block{width:100%}
.btn.sm{font-size:15px;padding:11px 18px}
.hero .btn{margin-top:18px;align-self:flex-start;white-space:nowrap}

/* ---------- Chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;background:var(--card);color:var(--ink-2);border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow-s);transition:background .18s,color .18s}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--green);color:#FBF7EE;box-shadow:0 6px 14px rgba(60,101,49,.22)}

/* ---------- Kacheln ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:20px;padding:14px 11px 12px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:6px;min-height:156px;transition:transform .16s ease}
.tile:active{transform:scale(.98)}
.tile-ic{width:52px;height:52px;border-radius:50%;background:var(--card-2);display:grid;place-items:center}
.tile-ic svg{width:30px;height:30px}
.tile h3{font-size:15px;line-height:1.15}
.tile p{font-size:12.5px;color:var(--ink-3);line-height:1.3;flex:1}
.tile-foot{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.tile-foot .meta{display:flex;align-items:center;gap:5px;min-width:0}
.tile-foot .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-foot svg{width:14px;height:14px;flex:0 0 14px}

/* ---------- Zitat ---------- */
.quote{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow-s);background:var(--card-2)}
.quote-scene{position:absolute;inset:0}
.quote-body{position:relative;padding:22px 20px 18px;text-align:center}
.quote-body p{font-family:var(--font-display);font-weight:400;font-style:italic;font-size:19px;line-height:1.32;color:var(--ink-2)}
.quote-rule{width:34px;height:2px;background:var(--line);margin:12px auto 8px;border-radius:2px}
.quote-body span{font-size:11px;letter-spacing:.26em;color:var(--ink-3);text-transform:uppercase;font-weight:700}

/* ---------- Tabbar ---------- */
.tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -6px 22px rgba(88,66,44,.10);padding:8px 10px 10px;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 5px;border-radius:18px;color:var(--ink-3);font-size:11.5px;font-weight:700;transition:color .18s,background .18s}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--green);background:var(--green-soft)}

/* ---------- Abschnitte ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec h3{font-size:19px}
.sec .more{font-size:13px;font-weight:800;color:var(--green)}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:800}

/* ---------- Listenzeilen ---------- */
.row{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:20px;padding:12px 14px 12px 12px;box-shadow:var(--shadow-s);width:100%;transition:transform .16s ease}
.row:active{transform:scale(.99)}
.row-ic{width:52px;height:52px;flex:0 0 52px;border-radius:16px;background:var(--card-2);display:grid;place-items:center}
.row-ic svg{width:30px;height:30px}
.row-main{flex:1;min-width:0}
.row-main h4{font-size:16px;line-height:1.2}
.row-main p{margin-top:2px;font-size:12.5px;color:var(--ink-3);line-height:1.35}
.row-meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--card-2);color:var(--ink-2);white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green-ink)}
.pill.amber{background:rgba(222,138,60,.16);color:var(--amber)}
.row-go{color:var(--ink-3);display:grid;place-items:center;flex:0 0 auto}
.row-go svg{width:18px;height:18px}
.row.today{border:1.5px solid var(--green-soft);box-shadow:var(--shadow-m)}
.row.done .row-ic{background:var(--green-soft)}
/* ---------- Player ---------- */
.player{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1)}
.player.open{transform:translateY(0)}
.player-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.circ{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow-s);display:grid;place-items:center}
.circ svg{width:20px;height:20px}
.player-title{flex:1;text-align:center;min-width:0}
.player-title h2{font-size:20px;display:flex;align-items:center;justify-content:center;gap:6px}
.player-title h2 svg{width:15px;height:15px;color:var(--leaf);flex:0 0 15px}
.player-title p{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.segbar{display:flex;gap:6px;padding:6px 26px 10px}
.seg{flex:1;height:5px;border-radius:3px;background:var(--card-3);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--green);border-radius:3px}
.seg.done i{width:100%}
.seg.now i{transition:width .96s linear}

/* Bühne */
.stage{position:relative;flex:1 1 auto;min-height:190px;border-radius:24px;margin:0 14px;overflow:hidden;background:var(--room-2)}
.stage svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.bubble{position:absolute;right:10px;top:34%;background:var(--card);border-radius:16px;padding:9px 13px;box-shadow:var(--shadow-m);max-width:150px}
.bubble b{font-family:var(--font-display);font-size:15px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.bubble b svg{width:15px;height:15px;color:var(--leaf)}
.bubble span{font-size:12px;color:var(--ink-2);line-height:1.3;display:block;margin-top:2px}
.cue{position:absolute;left:12px;top:22%;font-style:italic;font-size:13px;line-height:1.38;color:var(--ink-2);max-width:118px;transform:rotate(-4deg);text-shadow:0 1px 0 var(--scrim)}
.stage-tag{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}

/* Übungskarte */
.ex-card{flex:0 0 auto;margin:12px 14px 0;background:var(--card);border-radius:24px;box-shadow:var(--shadow-s);padding:16px 16px 14px;display:flex;gap:12px;align-items:flex-start}
.ex-text{flex:1;min-width:0}
.ex-text h3{font-size:24px;line-height:1.1}
.ex-text>p{margin-top:6px;font-size:13.5px;color:var(--ink-2);line-height:1.42}
.ex-cue{margin-top:9px;font-style:italic;font-size:13px;color:var(--green);display:flex;align-items:flex-start;gap:6px}
.ex-cue svg{width:15px;height:15px;flex:0 0 15px;margin-top:2px}
.ring{position:relative;flex:0 0 96px;width:96px;height:96px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:96px;height:96px;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--card-2);stroke-width:7}
.ring .fg{fill:none;stroke:var(--green);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .95s linear}
.ring-in{position:relative;text-align:center}
.ring-in .leaf{color:var(--leaf);display:block;margin:0 auto 1px}
.ring-in .leaf svg{position:static;width:15px;height:15px;transform:none}
.ring-in b{font-family:var(--font-display);font-size:23px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;line-height:1.05}
.ring-in span{font-size:11px;color:var(--ink-3);font-weight:700}

/* Steuerung */
.controls{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:34px;padding:16px 0 12px}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2)}
.ctrl .knob{width:58px;height:58px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;box-shadow:var(--shadow-s);transition:transform .14s ease}
.ctrl:active .knob{transform:scale(.94)}
.ctrl .knob svg{width:24px;height:24px}
.ctrl.main .knob{width:74px;height:74px;background:var(--green);color:#FBF7EE;box-shadow:0 10px 22px rgba(60,101,49,.30)}
.ctrl.main .knob svg{width:30px;height:30px}
.ctrl:disabled{opacity:.4}

/* Infokarten */
.info-cards{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:2px 14px 14px}
.info-card{background:var(--card);border-radius:18px;padding:11px 10px 10px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:5px}
.info-card .ic{width:36px;height:36px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center}
.info-card .ic svg{width:21px;height:21px;color:var(--green)}
.info-card h4{font-size:13.5px}
.info-card .txt{display:flex;align-items:flex-end;justify-content:space-between;gap:4px}
.info-card p{font-size:11.5px;color:var(--ink-3);line-height:1.25}
.info-card .txt>svg{width:15px;height:15px;color:var(--ink-3);flex:0 0 15px;margin-bottom:1px}

/* ---------- Abschluss ---------- */
.finish{position:absolute;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;text-align:center;gap:14px;overflow-y:auto}
.finish .fscene{width:220px;height:180px}
.finish h2{font-size:30px}
.finish>p{color:var(--ink-2);font-size:14.5px;max-width:280px}
.finish-stats{display:flex;gap:10px;width:100%;max-width:340px}
.fstat{flex:1;background:var(--card);border-radius:18px;padding:12px 8px;box-shadow:var(--shadow-s)}
.fstat b{font-family:var(--font-display);font-size:22px;display:block;line-height:1.1}
.fstat span{font-size:11.5px;color:var(--ink-3);font-weight:700}
.stiff-log{width:100%;max-width:340px;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow-s);text-align:left}
.stiff-log h4{font-size:15px}
.stiff-log p{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.stiff-opts{display:flex;gap:7px;margin-top:11px}
.stiff-opts button{flex:1;background:var(--card-2);border-radius:14px;padding:9px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--ink-2);transition:background .16s,color .16s}
.stiff-opts button[aria-pressed="true"]{background:var(--green);color:#FBF7EE}

/* ---------- Sheet ---------- */
.scrim{position:absolute;inset:0;z-index:40;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .26s ease}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:28px 28px 0 0;box-shadow:var(--shadow-l);padding:10px 18px 24px;max-height:82%;overflow-y:auto;transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.sheet.open{transform:translateY(0)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--card-3);margin:0 auto 14px}
.sheet h3{font-size:21px;display:flex;align-items:center;gap:8px}
.sheet h3 svg{width:20px;height:20px;color:var(--green)}
.sheet .lead{color:var(--ink-2);font-size:14px;margin-top:8px;line-height:1.5}
.steps{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:10px;counter-reset:s}

function icon(name, cls){
  const d = IP[name]; if(!d) return '';
  const paths = d.split('|').map(p=>`<path d="${p}"/>`).join('');
  return `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"${cls?` class="${cls}"`:''} aria-hidden="true">${paths}</svg>`;
}
const leafMark = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M21 3C11 3 5 6.6 5 13.6c0 1.6.5 3 1.3 4.1C8.8 12 13 8.6 18 6.8c-4.3 2.6-7.6 6.3-9.4 11.4 1 .5 2.2.8 3.4.8 5.6 0 9-4.9 9-16Z"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ============================================================
   2 — Panda-Rigs (alle in viewBox 0 0 320 240)

const DK='var(--panda-dark)', LT='var(--panda-light)', SH='var(--panda-shade)',
      PW='var(--paw)', PW2='var(--paw-2)', RS='var(--rose)';

/* Kopf von vorn */
function headFront(x,y,s=1){
  const p=(dx,dy)=>[x+dx*s, y+dy*s];
  const E=(dx,dy,rx,ry,fill,extra='')=>{const[a,b]=p(dx,dy);return `<ellipse cx="${a}" cy="${b}" rx="${rx*s}" ry="${ry*s}" fill="${fill}" ${extra}/>`;};
  const rot=(deg,dx,dy)=>{const[a,b]=p(dx,dy);return `transform="rotate(${deg} ${a} ${b})"`;};
  const path=(d,fill,stroke,w)=>`<path d="${d}" fill="${fill}" ${stroke?`stroke="${stroke}" stroke-width="${w*s}" stroke-linecap="round" stroke-linejoin="round"`:''}/>`;
  const P=(dx,dy)=>p(dx,dy).map(v=>Math.round(v*10)/10).join(' ');
  return `
  <g class="p-head">
    ${E(-30,-32,15,15,DK)}${E(30,-32,15,15,DK)}
    ${E(-30,-32,7.5,7.5,SH)}${E(30,-32,7.5,7.5,SH)}
    ${E(0,0,42,40,LT)}
    ${E(-17,-3,13.5,16.5,DK,rot(-14,-17,-3))}
    ${E(17,-3,13.5,16.5,DK,rot(14,17,-3))}
    ${path(`M${P(-24,-2)} Q${P(-17,-9)} ${P(-10,-2)}`,'none',LT,2.8)}
    ${path(`M${P(10,-2)} Q${P(17,-9)} ${P(24,-2)}`,'none',LT,2.8)}
    ${E(0,15,18,12.5,SH,'opacity=".45"')}
    ${path(`M${P(-6.5,7)} Q${P(0,3.5)} ${P(6.5,7)} Q${P(6,14)} ${P(0,14.5)} Q${P(-6,14)} ${P(-6.5,7)}Z`,DK)}
    ${path(`M${P(0,14.5)} L${P(0,17)}`,'none',DK,2.2)}
    ${path(`M${P(0,17)} Q${P(-5,21.5)} ${P(-9.5,18)}`,'none',DK,2.2)}
    ${path(`M${P(0,17)} Q${P(5,21.5)} ${P(9.5,18)}`,'none',DK,2.2)}
    ${E(-29,13,7.5,5.5,RS,'opacity=".4"')}${E(29,13,7.5,5.5,RS,'opacity=".4"')}
  </g>`;
}

/* Kopf im Profil, dir=1 blickt nach rechts */
function headSide(x,y,s=1,dir=1){
  const p=(dx,dy)=>[x+dx*dir*s, y+dy*s];
  const P=(dx,dy)=>p(dx,dy).map(v=>Math.round(v*10)/10).join(' ');
  const E=(dx,dy,rx,ry,fill,extra='')=>{const[a,b]=p(dx,dy);return `<ellipse cx="${a}" cy="${b}" rx="${rx*s}" ry="${ry*s}" fill="${fill}" ${extra}/>`;};
  const path=(d,fill,stroke,w)=>`<path d="${d}" fill="${fill}" ${stroke?`stroke="${stroke}" stroke-width="${w*s}" stroke-linecap="round" stroke-linejoin="round"`:''}/>`;
  return `
  <g class="p-head">
    ${E(-20,-28,13,13,DK)}${E(-20,-28,6.5,6.5,SH)}
    ${E(0,0,36,35,LT)}
    ${E(12,-4,12,14,DK)}
    ${path(`M${P(6,-3)} Q${P(12,-10)} ${P(18,-3)}`,'none',LT,2.6)}
    ${E(26,8,14,11,LT)}
    ${E(26,8,14,11,SH,'opacity=".35"')}
    ${path(`M${P(32,2)} Q${P(38,4)} ${P(35,9)} Q${P(31,11)} ${P(30,5)}Z`,DK)}
    ${path(`M${P(33,10)} Q${P(29,14.5)} ${P(24,12)}`,'none',DK,2)}
    ${E(4,13,6.5,5,RS,'opacity=".35"')}
  </g>`;
}

/* Gliedmaße als runde Linie */
const limb=(d,w=22,cls='',extra='')=>`<path class="${cls}" d="${d}" fill="none" stroke="${DK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
/* Fußsohle mit Ballen */
function sole(x,y,rx=15,ry=11,rot=0){
  return `<g transform="rotate(${rot} ${x} ${y})">
    <ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${PW}"/>
    <ellipse cx="${x}" cy="${y+ry*.22}" rx="${rx*.42}" ry="${ry*.36}" fill="${PW2}" opacity=".55"/>
    <circle cx="${x-rx*.5}" cy="${y-ry*.5}" r="${rx*.16}" fill="${PW2}" opacity=".55"/>
    <circle cx="${x}" cy="${y-ry*.62}" r="${rx*.16}" fill="${PW2}" opacity=".55"/>
    <circle cx="${x+rx*.5}" cy="${y-ry*.5}" r="${rx*.16}" fill="${PW2}" opacity=".55"/>
  </g>`;
}
const dumbbell=(x,y,r=1)=>`<g><rect x="${x-13*r}" y="${y-3*r}" width="${26*r}" height="${6*r}" rx="${3*r}" fill="var(--ink-2)"/><rect x="${x-17*r}" y="${y-8*r}" width="${8*r}" height="${16*r}" rx="${3*r}" fill="var(--ink)"/><rect x="${x+9*r}" y="${y-8*r}" width="${8*r}" height="${16*r}" rx="${3*r}" fill="var(--ink)"/></g>`;

    ? `<g class="p-knees">

  return `

}

/* ---------- Haltung: Stand (Vorderansicht) ---------- */
function rigStand(opt={}){
  const h = opt.hands||'down';
  let armL='M130 132 Q118 158 128 182', armR='M190 132 Q202 158 192 182', extra='';
  if(h==='shoulder'){ armL='M130 132 Q112 150 132 158'; armR='M190 132 Q208 150 188 158';
    extra = dumbbell(132,158,.8)+dumbbell(188,158,.8); }
  if(h==='reach'){ armL='M130 132 Q126 110 146 102'; armR='M190 132 Q194 110 174 102'; }
  if(h==='front'){ armL='M130 132 Q124 156 142 160'; armR='M190 132 Q196 156 178 160';
    extra = `<path class="p-band" d="M142 160 Q160 170 178 160" fill="none" stroke="var(--green)" stroke-width="6" stroke-linecap="round" opacity=".85"/>`; }
  if(h==='row'){ armL='M130 138 Q122 162 134 178'; armR='M190 138 Q198 162 186 178';
    extra = opt.band
      ? `<path class="p-band" d="M134 180 Q160 216 186 180" fill="none" stroke="var(--green)" stroke-width="6" stroke-linecap="round" opacity=".85"/><rect x="146" y="210" width="28" height="7" rx="3.5" fill="var(--ink-2)"/>`
      : dumbbell(134,180,.8)+dumbbell(186,180,.8); }
  const chair = opt.chair ? `<g opacity=".9">
      <rect x="196" y="156" width="56" height="10" rx="4" fill="var(--wood)"/>
      <rect x="240" y="104" width="10" height="54" rx="4" fill="var(--wood)"/>

      <rect x="240" y="164" width="8" height="48" rx="3" fill="var(--wood)"/>
    </g>`:'';
  let legL='M144 172 Q140 194 142 210', legR='M176 172 Q180 194 178 210',
      soleL=[142,214,14,9,0], soleR=[178,214,14,9,0], wall='';
  if(opt.stance==='lunge'){
    legL='M150 174 Q196 180 200 196'; legR='M168 174 Q126 196 96 206';
    soleL=[204,206,13,9,10]; soleR=[92,210,13,9,-6];
  }
  if(opt.stance==='calf'){
    legL='M150 174 Q188 186 204 198'; legR='M168 176 Q136 194 112 208';
    soleL=[208,204,13,9,14]; soleR=[108,212,14,9,0];
  }
  return `
  ${chair}${wall}
  <g class="p-body">
    <g class="p-legL">${limb(legL,22)}</g>
    <g class="p-legR">${limb(legR,22)}</g>
    ${sole(...soleL)}${sole(...soleR)}

      <g class="p-torso">
        <ellipse cx="160" cy="150" rx="44" ry="42" fill="${DK}"/>
        <ellipse cx="160" cy="156" rx="29" ry="29" fill="${LT}"/>

      <g class="p-armR">${limb(armR,20)}</g>

}

}

function streak(){
  const done=new Set(S.log.map(l=>l.date));
  let n=0, d=new Date();
  if(!done.has(todayKey(d))) d.setDate(d.getDate()-1);
  while(done.has(todayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

const SUBS={'band-rudern':'hantel-rudern','band-pullapart':'arme-oeffnen','hantel-rudern':'band-rudern','hantel-press':'band-pullapart','seitheben':'arme-oeffnen','stuhl-aufstehen':'marschieren'};
function hasEquip(ex){
  return (ex.equip||[]).every(e=>{
    if(e==='gym') return true;
    return S.equip[e];
  });
}
function resolveItems(prog, opts={}){
  const seen=new Set(); let list=[];
  for(const id of prog.items){
    let ex=EX[id], key=id;
    if(!hasEquip(ex) && SUBS[id] && hasEquip(EX[SUBS[id]])){ key=SUBS[id]; ex=EX[key]; }
    if(!hasEquip(ex)) continue;
    if(seen.has(key)) continue;
    seen.add(key);
    let sec=ex.sec;
    if(key==='geh-block') sec=S.run.minutes*60;
    if(key==='lauf-block') sec=S.run.outdoor*60;
    list.push({id:key, ex, sec});
  }
  if(!opts.full && prog.place==='home'){
    const target=S.minutes*60, tot=()=>list.reduce((a,i)=>a+i.sec,0);
    while(list.length>4 && tot() > target*1.15) list.splice(Math.floor(list.length/2),1);
    if(tot() < target*0.9){
      const f=Math.min(1.9, target/tot());
      list=list.map(i=>Object.assign({},i,{sec:Math.max(20, Math.round(i.sec*f/5)*5)}));
    }
  }
  return list;
}
const progMinutes = p => Math.max(1, Math.round(resolveItems(p).reduce((a,i)=>a+i.sec,0)/60));
function todayProgram(){
  const place=S.place;
  if(place==='gym') return PROG['gym-haltung'];
  if(place==='run') return PROG[S.run.mode==='band'?'lauf-band':'lauf-draussen'];
  const planned=PROG[S.plan[new Date().getDay()]];
  if(planned && planned.place==='home') return planned;
  return PROG['morgenflow'];
}

function chime(kind='step'){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const notes = kind==='done' ? [523.25,659.25,783.99] : [659.25];
    notes.forEach((f,idx)=>{
      const o=AC.createOscillator(), g=AC.createGain(), t0=AC.currentTime+idx*0.16;
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.18,t0+.04);
      g.gain.exponentialRampToValueAtTime(.0001,t0+.9);
      o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+1);
    });
  }catch(e){}
}

function lastDays(n){
  const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); out.push(d); } return out;
}
function barChart(){
  const days=lastDays(14);
  const vals=days.map(d=>{ const k=todayKey(d); return S.log.filter(l=>l.date===k).reduce((a,l)=>a+(l.min||0),0); });
  const max=Math.max(20, ...vals);
  const W=320,H=112, bw=W/14, pad=18;
  const bars=vals.map((v,i)=>{
    const h=Math.max(v>0?3:0,(v/max)*(H-pad-16));
    const x=i*bw+bw*.22, y=H-pad-h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.56).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${v>0?'var(--green)':'var(--card-3)'}"/>`;
  }).join('');
  const ticks=days.map((d,i)=>i%3===0?`<text class="ct" x="${(i*bw+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${d.getDate()}.</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minuten pro Tag in den letzten 14 Tagen">
    <line x1="0" y1="${H-pad}" x2="${W}" y2="${H-pad}" stroke="var(--line)" stroke-width="1"/>
    <text class="ct" x="0" y="12">${max} Min</text>
    ${bars}${ticks}</svg>`;
}
function stiffChart(){
  const pts=S.log.filter(l=>typeof l.stiff==='number').slice(-14);
  if(pts.length<2) return `<div class="empty">Trag nach zwei Einheiten deine Morgensteifigkeit ein – dann zeigt Pandamo dir hier die Kurve.</div>`;
  const W=320,H=112,pad=20, max=Math.max(60,...pts.map(p=>p.stiff));
  const X=i=>pts.length===1?W/2:(i/(pts.length-1))*(W-12)+6;
  const Y=v=>H-pad-(v/max)*(H-pad-16);
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.stiff).toFixed(1)}`).join(' ');
  const area=`${d} L${X(pts.length-1).toFixed(1)} ${H-pad} L${X(0).toFixed(1)} ${H-pad}Z`;

const $ = s => document.querySelector(s);
const playerEl=$('#player'), finishEl=$('#finish'), screenEl=$('#screen'), sheetEl=$('#sheet'), scrimEl=$('#scrim');
let SESSION=null, TICK=null;
const RING=2*Math.PI*42;

function startSession(progId){
  const prog=PROG[progId]; if(!prog) return;
  const items=resolveItems(prog);
  if(!items.length){ toast('Für dieses Programm fehlt die Ausrüstung'); return; }
  SESSION={prog, items, i:0, left:items[0].sec, running:true, elapsed:0, total:0, phase:''};
  renderPlayer();
  playerEl.hidden=false;
  requestAnimationFrame(()=>playerEl.classList.add('open'));
  clearInterval(TICK); TICK=setInterval(tick,1000);
  chime('step');
}
function closePlayer(){
  clearInterval(TICK); TICK=null;
  playerEl.classList.remove('open');
  setTimeout(()=>{ playerEl.hidden=true; playerEl.innerHTML=''; },320);
  SESSION=null;
}
function renderPlayer(){

  if(it.id==='geh-block') tags.push(`<span class="pill green">${String(S.run.speed).replace('.',',')} km/h · ${S.run.incline}%</span>`);
  return void (playerEl.innerHTML=`
  <div class="player-head">
    <button class="circ" data-player-close="1" aria-label="Einheit verlassen">${icon('arrowL')}</button>

  </div>
  <div class="segbar" aria-hidden="true">

        <circle class="bg" cx="48" cy="48" r="42"/>

      </svg>

        <span class="leaf">${leafMark}</span>
        <b id="tTime">${fmt(s.left)}</b>

      </div>
    </div>
  </div>
  <div class="controls">
    <button class="ctrl" data-prev="1" ${s.i===0?'disabled':''}><span class="knob">${icon('prev')}</span>Zurück</button>
    <button class="ctrl main" data-toggle-run="1"><span class="knob" id="runIc">${icon(s.running?'pause':'play')}</span><span id="runLb">${s.running?'Pause':'Weiter'}</span></button>
    <button class="ctrl" data-next="1"><span class="knob">${icon('next')}</span>Weiter</button>
  </div>

    <button class="info-card" data-sheet="atmung"><span class="ic">${icon('wind')}</span><h4>Atmung</h4><span class="txt"><p>Ruhig und tief</p>${icon('chev')}</span></button>
    <button class="info-card" data-sheet="vorteile"><span class="ic">${icon('heart')}</span><h4>Vorteile</h4><span class="txt"><p>Was es bringt</p>${icon('chev')}</span></button>
  </div>`);
}
function tick(){
  const s=SESSION; if(!s||!s.running) return;
  s.left--; s.elapsed++; s.total++;
  const it=s.items[s.i];
  if(it.ex.side && s.left===Math.floor(it.sec/2)){ toast('Seite wechseln'); chime('step'); }
  paintTimer();
  if(s.left<=0) advance(1,true);
}
function paintTimer(){
  const s=SESSION; if(!s) return;
  const it=s.items[s.i];
  const t=document.getElementById('tTime'); if(t) t.textContent=fmt(Math.max(0,s.left));
  const fg=document.getElementById('ringFg');
  if(fg) fg.style.strokeDashoffset = (RING*(1-Math.max(0,s.left)/it.sec)).toFixed(1);
  const seg=document.getElementById('seg'+s.i);
  if(seg) seg.style.width = (100*(1-Math.max(0,s.left)/it.sec)).toFixed(1)+'%';
  /* Atemphase */
  const cyc = it.ex.anim==='breathe'?10:8, inh = it.ex.anim==='breathe'?4:4;
  const ph = (s.elapsed%cyc) < inh ? 'in':'out';
  if(ph!==s.phase){
    s.phase=ph;
    const b=document.getElementById('bPhase'), x=document.getElementById('bText');
    if(b&&x){ b.innerHTML=`${leafMark} ${ph==='in'?'Einatmen':'Ausatmen'}`; x.textContent = ph==='in'?it.ex.bIn:it.ex.bOut; }
  }
}
function advance(dir, auto){
  const s=SESSION; if(!s) return;
  const n=s.i+dir;
  if(n<0) return;
  if(n>=s.items.length){ finishSession(); return; }
  s.i=n; s.left=s.items[n].sec; s.elapsed=0; s.phase='';
  renderPlayer(); paintTimer();
  if(auto) chime('step');
}
function toggleRun(){
  const s=SESSION; if(!s) return;
  s.running=!s.running;
  const pv=playerEl.querySelector('.pv'); if(pv) pv.classList.toggle('paused',!s.running);
  const ic=document.getElementById('runIc'), lb=document.getElementById('runLb');
  if(ic) ic.innerHTML=icon(s.running?'pause':'play');
  if(lb) lb.textContent=s.running?'Pause':'Weiter';
}

      <div class="group" style="margin-top:12px">
        <button class="opt" data-runmode-set="band" style="width:100%"><span class="oic">${icon('gym')}</span><span class="om"><b>Laufband mit Steigung</b><span>${String(S.run.speed).replace('.',',')} km/h · ${S.run.incline} % · ${S.run.minutes} Min</span></span>${S.run.mode==='band'?icon('check'):icon('chev')}</button>
        <button class="opt" data-runmode-set="out" style="width:100%"><span class="oic">${icon('shoe')}</span><span class="om"><b>Draußen joggen</b><span>${S.run.outdoor} Min locker</span></span>${S.run.mode==='out'?icon('check'):icon('chev')}</button>
      </div>
      <button class="btn block ghost" data-go-profil="1" style="margin-top:14px">Werte ändern</button>`;
  }
  if(kind.startsWith('ex:')){
    const e=EX[kind.slice(3)]; if(!e) return '';
    return `<h3>${icon(tagIcon(e.tag))}${esc(e.name)}</h3>
      <div style="height:170px;border-radius:20px;overflow:hidden;margin-top:12px;background:var(--room-2)">${pandaScene(e.pose,e.anim,e.opt||{})}</div>
      <p class="lead">${esc(e.short)}</p>
      <ol class="steps">${e.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
      <ul class="bullets">${e.benefits.map(b=>`<li>${icon('leaf')}<span>${esc(b)}</span></li>`).join('')}</ul>`;
  }
  return '';
}
let MEAS={wall:2,chest:3.5};
/* ============================================================
   14 — Navigation & Ereignisse
   ============================================================ */
const TABS=[{id:'start',label:'Start',ic:'home'},{id:'kurse',label:'Kurse',ic:'courses'},{id:'fortschritt',label:'Fortschritt',ic:'chart'},{id:'profil',label:'Profil',ic:'user'}];
const VIEWS={start:viewHome,kurse:viewKurse,fortschritt:viewFortschritt,profil:viewProfil};
let TAB='start';
function render(){
  screenEl.innerHTML=VIEWS[TAB]();
  document.getElementById('tabbar').innerHTML=TABS.map(t=>
    `<button class="tab" role="tab" aria-selected="${TAB===t.id}" data-go="${t.id}">${icon(t.ic)}${t.label}</button>`).join('');
  document.documentElement.classList.toggle('calm', !!S.calm);
}
function go(tab){ if(!VIEWS[tab]) return; TAB=tab; render(); screenEl.scrollTop=0; }

const STEPS={
  minutes:{get:()=>S.minutes,set:v=>S.minutes=Math.min(40,Math.max(5,v)),d:5},
  incline:{get:()=>S.run.incline,set:v=>S.run.incline=Math.min(15,Math.max(0,v)),d:1},
  speed:{get:()=>S.run.speed,set:v=>S.run.speed=Math.round(Math.min(12,Math.max(2,v))*10)/10,d:.5},
  runmin:{get:()=>S.run.minutes,set:v=>S.run.minutes=Math.min(90,Math.max(5,v)),d:5},
  outmin:{get:()=>S.run.outdoor,set:v=>S.run.outdoor=Math.min(120,Math.max(5,v)),d:5},
  mwall:{get:()=>MEAS.wall,set:v=>MEAS.wall=Math.max(0,Math.round(v*10)/10),d:.5},
  mchest:{get:()=>MEAS.chest,set:v=>MEAS.chest=Math.max(0,Math.round(v*10)/10),d:.5}
};

document.addEventListener('click', e=>{
  const t=e.target;
  if(!(t instanceof Element)) return;
  const hit=(sel)=>t.closest(sel);
  let el;

  if((el=hit('[data-go]'))){ go(el.dataset.go); return; }
  if((el=hit('[data-start]'))){ startSession(el.dataset.start); return; }
  if((el=hit('[data-ex]'))){ openSheet(sheetFor('ex:'+el.dataset.ex)); return; }
  if((el=hit('[data-sheet]'))){
    const k=el.dataset.sheet;
    if(k==='measure'){ const m=S.measures.slice(-1)[0]; MEAS={wall:m&&m.wall!=null?m.wall:2, chest:m&&m.chest!=null?m.chest:3.5}; }
    openSheet(sheetFor(k)); return;
  }
  if((el=hit('[data-runmode]'))){ openSheet(sheetFor('runmode')); return; }
  if((el=hit('[data-runmode-set]'))){ S.run.mode=el.dataset.runmodeSet; S.place='run'; save(); closeSheet(); render(); return; }
  if((el=hit('[data-go-profil]'))){ closeSheet(); go('profil'); return; }
  if((el=hit('[data-place]'))){ S.place=el.dataset.place; save(); render(); return; }
  if((el=hit('[data-toggle]'))){
    const k=el.dataset.toggle;
    if(k==='sound'){ S.sound=!S.sound; if(S.sound) chime('step'); }
    else if(k==='calm'){ S.calm=!S.calm; }
    else S.equip[k]=!S.equip[k];
    save(); render(); return;
  }
  if((el=hit('[data-step]'))){
    const [k,dir]=el.dataset.step.split(':'); const st=STEPS[k]; if(!st) return;
    st.set(st.get()+st.d*Number(dir));
    if(k==='mwall'||k==='mchest'){ sheetEl.innerHTML=`<div class="grab"></div>${sheetFor('measure')}`; }
    else { save(); render(); }
    return;
  }
  if((el=hit('[data-measure-save]'))){
    S.measures.push({date:todayKey(), wall:MEAS.wall, chest:MEAS.chest}); save(); closeSheet();
    toast('Messwerte gespeichert'); if(TAB==='fortschritt') render(); return;
  }
  if((el=hit('[data-player-close]'))){ closePlayer(); render(); return; }
  if((el=hit('[data-prev]'))){ advance(-1); return; }
  if((el=hit('[data-next]'))){ advance(1); return; }
  if((el=hit('[data-toggle-run]'))){ toggleRun(); return; }
  if((el=hit('[data-stiff]'))){
    const v=Number(el.dataset.stiff);
    const last=S.log[S.log.length-1]; if(last){ last.stiff=v; save(); }
    el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===el?'true':'false'));
    return;
  }
  if((el=hit('[data-finish-close]'))){ closeFinish(); return; }
  if((el=hit('[data-reset]'))){
    openSheet(`<h3>${icon('trash')}Daten löschen</h3><p class="lead">Alle Einheiten, Messwerte und Einstellungen auf diesem Gerät werden entfernt. Das lässt sich nicht rückgängig machen.</p>
      <button class="btn block danger ghost" data-reset-yes="1" style="margin-top:16px">Ja, alles löschen</button>
      <button class="btn block soft" data-sheet-close="1" style="margin-top:8px">Abbrechen</button>`);
    return;
  }
  if((el=hit('[data-reset-yes]'))){
    try{ localStorage.removeItem(KEY); }catch(err){}
    S=structuredClone(DEFAULTS); closeSheet(); go('start'); toast('Alles zurückgesetzt'); return;
  }
  if((el=hit('[data-sheet-close]')) || t===scrimEl){ closeSheet(); return; }
  if((el=hit('[data-intro-place]'))){ S.place=el.dataset.introPlace; save(); renderIntro(); return; }
  if((el=hit('[data-intro-equip]'))){ const k=el.dataset.introEquip; S.equip[k]=!S.equip[k]; save(); renderIntro(); return; }
  if((el=hit('[data-intro-min]'))){ S.minutes=Number(el.dataset.introMin); save(); renderIntro(); return; }
  if((el=hit('[data-intro-done]'))){ S.intro=false; save(); $('#intro').hidden=true; render(); return; }
});
document.addEventListener('change', e=>{
  const sel=e.target.closest('[data-plan]');
  if(sel){ S.plan[sel.dataset.plan]=sel.value; save(); toast('Wochenplan aktualisiert'); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(sheetEl.classList.contains('open')) return closeSheet();
    if(!playerEl.hidden) return closePlayer();
  }
  if(e.code==='Space' && !playerEl.hidden && SESSION){ e.preventDefault(); toggleRun(); }
});

/* ============================================================
   15 — Einrichtung beim ersten Start
   ============================================================ */
function renderIntro(){
  const el=$('#intro');
  el.innerHTML=`
    <div class="intro-scene">${pandaScene('sit','breathe',{hands:'ribs'})}</div>
    <div>
      <div class="wordmark" style="font-size:34px"><span>Panda<em>mo</em></span>${leafMark}</div>
      <div class="claim" style="font-size:14px">Find your calm.</div>
    </div>
    <p class="lead">Tägliche Bewegung bei Morbus Bechterew: Beweglichkeit, Atmung, Kraft – in Einheiten, die sich auch an steifen Tagen machen lassen.</p>
    <div class="pickers">
      <div class="picker"><h4>Wo trainierst du meistens?</h4>
        <div class="multi">${PLACES.map(p=>`<button data-intro-place="${p.id}" aria-pressed="${S.place===p.id}">${icon(p.ic)}${p.label}</button>`).join('')}</div>
      </div>
      <div class="picker"><h4>Was hast du zu Hause?</h4>
        <div class="multi">
          <button data-intro-equip="stuhl" aria-pressed="${S.equip.stuhl}">${icon('chair')}Stuhl</button>
          <button data-intro-equip="hanteln" aria-pressed="${S.equip.hanteln}">${icon('dumbbell')}Mini-Hanteln</button>
          <button data-intro-equip="band" aria-pressed="${S.equip.band}">${icon('band')}Sportband</button>
        </div>
      </div>
      <div class="picker"><h4>Wie lange am Stück?</h4>
        <div class="multi">${[10,15,20,25].map(m=>`<button data-intro-min="${m}" aria-pressed="${S.minutes===m}">${icon('clock')}${m} Min</button>`).join('')}</div>
      </div>
    </div>
    <button class="btn block" data-intro-done="1" style="margin-top:6px">Los geht's ${icon('arrowR')}</button>
    <p class="disclaimer" style="text-align:center">Kein Ersatz für ärztliche Behandlung oder Physiotherapie. Alle Daten bleiben auf diesem Gerät.</p>`;
  el.hidden=false;
}

/* ============================================================
   16 — Start
   ============================================================ */
render();
if(S.intro) renderIntro();
</script>

<script>
/* ============================================================
   17 — Nur in der installierten Version:
   Bildschirm wachhalten + Offline-Betrieb
   ============================================================ */
let WAKE=null;
async function wakeOn(){
  try{ if('wakeLock' in navigator && !WAKE){ WAKE=await navigator.wakeLock.request('screen'); WAKE.addEventListener('release',()=>{WAKE=null;}); } }catch(e){}
}
async function wakeOff(){ try{ if(WAKE){ const w=WAKE; WAKE=null; await w.release(); } }catch(e){} }
setInterval(()=>{ (typeof SESSION!=='undefined' && SESSION && SESSION.running) ? wakeOn() : wakeOff(); }, 2000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && typeof SESSION!=='undefined' && SESSION && SESSION.running) wakeOn();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
